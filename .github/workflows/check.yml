# Canonical Node/Python checks and the Playwright browser suite.
name: Check

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
          cache: pip
      - run: npm ci
      - run: npm run check:supply-chain
      - run: python -m pip install --require-hashes -r requirements/ci.lock
      - run: xvfb-run -a env PYTHON=python npm run check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
          cache: pip
      - run: npm ci
      - run: python -m pip install --require-hashes -r requirements/ci.lock
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a env PYTHON=python npm run check:browser
