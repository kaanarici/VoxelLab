# Manual unsigned desktop release from protected main. Verification and package
# builds finish before approval creates the immutable tag and GitHub Release.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact package tag to release, for example v1.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-canonical:
    uses: ./.github/workflows/check.yml

  verify-lab-readiness:
    runs-on: ubuntu-latest
    needs:
      - verify-canonical
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify release request
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Reject an existing release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check_release_identity.mjs "$GITHUB_REPOSITORY" "$RELEASE_TAG"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
          cache: pip
      - run: node scripts/check_release_version.mjs "$RELEASE_TAG"
      - run: npm ci
      - run: python -m pip install --require-hashes -r requirements/ci.lock
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a env PYTHON=python node scripts/check_lab_readiness.mjs --skip-validation-matrix --skip-public-export --report lab-readiness-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voxellab-lab-readiness
          if-no-files-found: error
          retention-days: 14
          path: lab-readiness-report.json

  build-macos:
    runs-on: macos-latest
    needs:
      - verify-lab-readiness
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run desktop:make:mac
      - run: node scripts/check_desktop_make_outputs.mjs out/forge/make darwin
      - run: npm run desktop:smoke:packaged:mac
      - run: npm run desktop:smoke:release:mac
      - name: Verify ad-hoc macOS signature
        run: |
          APP_PATH="$(find out/forge -maxdepth 3 -type d -name 'VoxelLab.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH" 2>&1 | grep -q 'Signature=adhoc'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voxellab-macos
          if-no-files-found: error
          path: out/forge/make/**/*.dmg

  build-windows:
    runs-on: windows-latest
    needs:
      - verify-lab-readiness
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run desktop:make:win -- --arch=x64
      - run: node scripts/check_desktop_make_outputs.mjs out/forge/make win32
      - run: npm run desktop:smoke:packaged:win
      - name: Verify unsigned Windows executables
        shell: pwsh
        run: |
          $targets = Get-ChildItem out/forge -Recurse -File -Filter *.exe |
            Where-Object { $_.Name -eq 'VoxelLab.exe' -or $_.Name -like '*Setup*.exe' }
          if ($targets.Count -lt 2) { throw 'Expected packaged VoxelLab.exe and installer executable' }
          $signatures = $targets | ForEach-Object { Get-AuthenticodeSignature $_.FullName }
          $signatures | Format-Table Path, Status, StatusMessage
          if ($signatures | Where-Object Status -ne 'NotSigned') {
            throw 'VoxelLab releases are intentionally unsigned; unexpected signature state detected'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voxellab-windows
          if-no-files-found: error
          path: out/forge/make/**/*Setup*.exe

  publish:
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs:
      - verify-lab-readiness
      - build-macos
      - build-windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: voxellab-macos
          path: release-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: voxellab-windows
          path: release-inputs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
      - run: node scripts/prepare_public_release_assets.mjs release-inputs public-assets "$RELEASE_TAG"
      - run: node scripts/write_release_checksums.mjs public-assets public-assets/SHA256SUMS
      - run: node scripts/check_release_assets.mjs public-assets "$RELEASE_TAG"
      - name: Recheck release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check_release_identity.mjs "$GITHUB_REPOSITORY" "$RELEASE_TAG"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: public-assets/SHA256SUMS
      - run: node scripts/extract_release_notes.mjs CHANGELOG.md release-notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: public-assets/*
